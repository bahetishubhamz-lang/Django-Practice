
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student List</title>
</head>
<body>

    <h1>Student Records</h1>

            
    <table border="1">
        <thead>
            <tr>
                <th>ID</th>
                <th>Name</th>
                <th>Age</th>
                <th>Email</th>
                <th>URL</th>
                <th>Student List</th>
            </tr>
        </thead>

        <tbody>
        
            <tr>
                <td>{{ student.id }}</td>
                <td>{{ student.name }}</td>
                <td>{{ student.age }}</td>
                <td>{{ student.email }}</td>
                <td><a href="{% url 'createstud' %}">Add Student</a></td>
                <td><a href="{% url 'getstudentdata' %}">StudentList</a></td>
            </tr>
           
        
        </tbody>
    </table>

</body>
</html>
